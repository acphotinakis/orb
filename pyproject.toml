[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orb"
version = "0.1.0"
description = "SPY Opening Range Breakout Quantitative Research System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "acphotinakis" }]
dependencies = [
    "alpaca-py>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "mplfinance>=0.12.9b0",
    "matplotlib>=3.7.0",
    "pyarrow>=14.0.0",
    "plotly>=5.15.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff==0.16.8",
    "black==26.5.1",
    "flake8==7.3.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E203",  # whitespace before ':' (black compatibility)
    "E501",  # line length handled by black / flake8
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/app.py" = ["E402"]
"src/visualization/*" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py310"]
